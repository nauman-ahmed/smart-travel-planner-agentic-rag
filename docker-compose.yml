services:
  streamlit:
    build: .
    container_name: smart-travel-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: smart-travel-n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
      - ./data:/data
      - ./:/project
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Europe/Berlin
      - NODES_EXCLUDE="[]"
    restart: unless-stopped